apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: tdd
  version: 0.1.0
  description: "Test-driven development: the red-green loop that produces tests worth keeping."
spec:
  entrypoint: SKILL.md
  capabilities:
    - testing.test-first
    - testing.red-green-refactor
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
