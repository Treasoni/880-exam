apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: grill-with-docs
  version: 0.1.0
  description: "A relentless interview to sharpen a plan or design, creating docs (ADRs and glossary) as it goes."
spec:
  entrypoint: SKILL.md
  capabilities:
    - design.grilling
    - docs.record
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn:
    - Skill/grilling
    - Skill/domain-modeling
  lifecycle:
    discoverable: true
    deprecated: false
