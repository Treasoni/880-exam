apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: obsidian-markdown
  version: 0.1.0
  description: "Create and edit Obsidian Flavored Markdown with wikilinks, embeds, callouts, properties, and other Obsidian-specific syntax."
spec:
  entrypoint: SKILL.md
  capabilities:
    - obsidian.markdown.create
    - obsidian.markdown.edit
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
