apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: writing-great-skills
  version: 0.1.0
  description: "Reference for writing and editing skills well — the vocabulary and principles that make a skill predictable."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skills.write
    - skills.edit
  permissions:
    filesystem: none
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
