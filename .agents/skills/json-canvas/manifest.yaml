apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: json-canvas
  version: 0.1.0
  description: "Create and edit JSON Canvas files (.canvas) with nodes, edges, groups, and connections."
spec:
  entrypoint: SKILL.md
  capabilities:
    - canvas.create
    - canvas.edit
    - canvas.validate
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
