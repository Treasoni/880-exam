apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: git-guardrails-claude-code
  version: 0.1.0
  description: "Set up Claude Code hooks to block dangerous git commands (push, reset --hard, clean, branch -D, etc.) before they execute."
spec:
  entrypoint: SKILL.md
  capabilities:
    - git.guardrails
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
