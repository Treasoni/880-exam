apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: writing-fragments
  version: 0.1.0
  description: "Writing, explore — mine raw fragments from a grilling session into a markdown file."
spec:
  entrypoint: SKILL.md
  capabilities:
    - writing.fragments
    - writing.explore
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
