apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: to-spec
  version: 0.1.0
  description: "Turn the current conversation into a spec and publish it to the project issue tracker."
spec:
  entrypoint: SKILL.md
  capabilities:
    - spec.synthesize
    - issue-tracker.publish
  permissions:
    filesystem: read
    network: none
    subprocess: allow
    git: none
  dependsOn:
    - Skill/setup-matt-pocock-skills
  lifecycle:
    discoverable: true
    deprecated: false
