apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: prompt-cache-optimizer
  version: 0.1.0
  description: "审计并优化 LLM 提示缓存命中率、输入 token、延迟与调用成本。"
spec:
  entrypoint: SKILL.md
  capabilities:
    - prompt-cache.audit
    - prompt-cache.optimize
    - prompt-cache.build-regression
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: read
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
