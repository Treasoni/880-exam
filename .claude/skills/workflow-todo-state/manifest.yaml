apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: workflow-todo-state
  version: 0.1.0
  description: "Create or retrofit reusable named workflow state machines for recoverable multi-step agent workflows."
spec:
  entrypoint: SKILL.md
  capabilities:
    - workflow.state-machine
    - workflow.routing-sync
    - workflow.retrofit
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
