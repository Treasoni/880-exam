apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: sync-skill-registry
  version: 0.1.0
  description: "技能注册表同步工具。扫描 agent skill 目录中的 */SKILL.md 并自动更新 skill-invocation.md 中的技能列表表格。"
spec:
  entrypoint: SKILL.md
  capabilities:
    - skills.sync-registry
    - skills.registry-generate
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
